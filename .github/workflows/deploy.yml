name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          : "${SERVER_HOST:?SERVER_HOST is missing}"
          : "${SERVER_USER:?SERVER_USER is missing}"
          : "${SERVER_SSH_KEY:?SERVER_SSH_KEY is missing}"

          SERVER_PORT="${SERVER_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Checking TCP connectivity to SSH port..."
          timeout 10 bash -c "</dev/tcp/$SERVER_HOST/$SERVER_PORT"

          echo "Scanning SSH host key..."
          ssh-keyscan -T 10 -H -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

          echo "Connecting over SSH..."
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$SERVER_USER@$SERVER_HOST" \
            "cd /home/$SERVER_USER/solari-backend && ./deploy.sh"
